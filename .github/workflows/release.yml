name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: the tag matches package.json
        run: |
          v="v$(node -p "require('./package.json').version")"
          test "$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match package.json $v"; exit 1; }
      - name: contracts check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run contracts:check
      - run: npm run typecheck
      - run: npm test
      - run: npm pack
      - name: the tarball installs and imports in an empty project
        run: |
          tgz="$PWD/$(ls beacon-library-*.tgz)"
          mkdir /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$tgz" >/dev/null
          node --input-type=module -e 'import * as b from "beacon-library"; if (typeof b.startSocketLoop !== "function") process.exit(1); console.log("ok", Object.keys(b).length, "exports");'
      - name: publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tgz="$(ls beacon-library-*.tgz)"
          sha256sum "$tgz" > "$tgz.sha256"
          gh release create "$GITHUB_REF_NAME" "$tgz" "$tgz.sha256" --title "$GITHUB_REF_NAME" --notes "beacon-library $GITHUB_REF_NAME, packed from $GITHUB_SHA"
